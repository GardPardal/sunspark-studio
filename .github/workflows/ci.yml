name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores públicos (anon/publishable) — necessários para o build do cliente.
      VITE_SUPABASE_URL: https://dwwospznutfbxcbbcqfa.supabase.co
      VITE_SUPABASE_PROJECT_ID: dwwospznutfbxcbbcqfa
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
