<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sala de Comando LZ7</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <style>
      /* A casca so precisa saber desenhar "carregando" e "deu ruim". Todo o resto
   do visual vem do banco, junto com o painel. */
      :root {
        --g: #f3f6f1;
        --s: #ffffff;
        --i: #0f1610;
        --i2: #586559;
        --l: #dae2d7;
        --b: #1a5c2a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --g: #0a0e0a;
          --s: #121a13;
          --i: #e6ede5;
          --i2: #94a396;
          --l: #253226;
          --b: #57bc72;
        }
      }
      :root[data-theme="dark"] {
        --g: #0a0e0a;
        --s: #121a13;
        --i: #e6ede5;
        --i2: #94a396;
        --l: #253226;
        --b: #57bc72;
      }
      html,
      body {
        margin: 0;
        background: var(--g);
        color: var(--i);
        font:
          15px/1.6 "IBM Plex Sans",
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #booting {
        max-width: 640px;
        margin: 0 auto;
        padding: 72px 22px;
      }
      #booting .t {
        font-family: "Archivo", Arial, sans-serif;
        font-weight: 800;
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      #booting .d {
        color: var(--i2);
        margin-top: 8px;
      }
      #booting .card {
        border: 1px solid var(--l);
        border-left: 3px solid var(--b);
        background: var(--s);
        border-radius: 10px;
        padding: 15px 17px;
      }
      .pulso {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--b);
        margin-right: 9px;
        vertical-align: middle;
        animation: p 1.1s ease-in-out infinite;
      }
      @keyframes p {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulso {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="booting">
      <div class="card">
        <div class="t"><span class="pulso"></span>Sala de Comando</div>
        <div class="d">Carregando os n&uacute;meros&hellip;</div>
      </div>
    </div>

    <script>
      /* =====================================================================
   LIGACAO COM O BANCO - a unica coisa configuravel neste arquivo.
   ===================================================================== */
      window.HUB_SB_URL = "https://dwwospznutfbxcbbcqfa.supabase.co";
      window.HUB_SB_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3d29zcHpudXRmYnhjYmJjcWZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNTA4MDgsImV4cCI6MjA5ODkyNjgwOH0.S-pUCNquKJAy83OnuOLokcvB2MlZYT6CibN1ufPbY_M";
    </script>
    <style>
      /* Barra "ao vivo" + filtro de data. Usa as cores do painel quando existem. */
      .livebar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        padding: 8px 0 10px;
        font:
          13px/1.4 "IBM Plex Sans",
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--ink-2, var(--i2));
      }
      .livebar .lv {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        color: var(--ink, var(--i));
      }
      .livebar .lv i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--brand, var(--b));
        animation: p 1.6s ease-in-out infinite;
      }
      .livebar .lv.passado i {
        background: var(--ink-3, var(--i2));
        animation: none;
      }
      .livebar label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .livebar input[type="date"],
      .livebar button {
        font: inherit;
        color: var(--ink, var(--i));
        background: var(--surface, var(--s));
        border: 1px solid var(--line, var(--l));
        border-radius: 8px;
        padding: 4px 9px;
        min-height: 30px;
      }
      .livebar button {
        cursor: pointer;
      }
      .livebar button:hover {
        border-color: var(--brand, var(--b));
      }
      .livebar .info {
        flex-basis: 100%;
        font-size: 12px;
        display: none;
      }
      .livebar .info.on {
        display: block;
      }
      .livebar .info b {
        color: var(--ink, var(--i));
      }
    </style>
    <script>
      /* A casca busca numeros E painel no mesmo lugar e monta a pagina.
   Nao ha nada do hub aqui dentro: por isso este arquivo nao precisa
   mais ser trocado quando o painel muda.

   Ao vivo: pede ao servidor a camada recalculada das fontes (Ploomes/Meta)
   e confere de minuto em minuto; quando os numeros mudam, recarrega sozinha.
   ?ate=AAAA-MM-DD mostra o painel como estava naquele dia. */
      (function () {
        var EP = "/api/public/dashhub/dados";
        var POLL_MS = 60000;
        var params = new URLSearchParams(location.search);
        var ate = /^\d{4}-\d{2}-\d{2}$/.test(params.get("ate") || "") ? params.get("ate") : "";
        var assinatura = null;

        function erro(titulo, det) {
          var b = document.getElementById("booting");
          if (!b) return;
          b.innerHTML =
            '<div class="card"><div class="t">' +
            titulo +
            "</div>" +
            '<div class="d">' +
            det +
            "<br><br>A página está no ar; quem não respondeu foi a base. " +
            "Recarregue em alguns minutos — nada foi perdido.</div></div>";
        }
        function url(extra) {
          return (
            EP + "?ao_vivo=1" + (ate ? "&ate=" + ate : "") + (extra || "") + "&t=" + Date.now()
          );
        }
        function busca(u) {
          return fetch(u, { cache: "no-store" }).then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          });
        }
        function assina(d) {
          var H = d.H || {};
          return JSON.stringify([
            H.mes && H.mes.vend,
            (H.fichas || []).map(function (f) {
              return [f.n, f.ano, f.ago, f.vlrano];
            }),
            d.MA && d.MA.g,
            d.LIVE && d.LIVE.base_snapshot,
          ]);
        }
        function hora(iso) {
          try {
            return new Date(iso).toLocaleTimeString("pt-BR", {
              hour: "2-digit",
              minute: "2-digit",
            });
          } catch (_) {
            return "";
          }
        }
        function dataBR(iso) {
          var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
          return m ? m[3] + "/" + m[2] + "/" + m[1] : iso || "—";
        }
        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }

        function montaBarra(live) {
          var alvo = document.querySelector("header.top .topin") || document.body;
          var bar = document.createElement("div");
          bar.className = "livebar";
          var hoje = (live && live.corte && live.ao_vivo && live.corte) || "";
          var status = live
            ? live.ao_vivo
              ? '<span class="lv"><i></i>Ao vivo · atualizado às <span id="lvHora">' +
                hora(live.gerado_em) +
                "</span></span>"
              : '<span class="lv passado"><i></i>Visão de ' + dataBR(live.corte) + "</span>"
            : '<span class="lv passado"><i></i>Pacote salvo (sem camada ao vivo)</span>';
          bar.innerHTML =
            status +
            '<label>Ver dia <input type="date" id="lvData"></label>' +
            (ate ? '<button type="button" id="lvHoje">Voltar para hoje</button>' : "") +
            '<button type="button" id="lvInfo" aria-expanded="false">O que é ao vivo?</button>' +
            '<div class="info" id="lvTexto"></div>';
          alvo.appendChild(bar);

          var inp = bar.querySelector("#lvData");
          var max = hoje || new Date(Date.now() - 3 * 3600000).toISOString().slice(0, 10);
          inp.max = max;
          inp.value = ate || max;
          inp.addEventListener("change", function () {
            var v = inp.value;
            var q = new URLSearchParams(location.search);
            if (!v || v >= max) q.delete("ate");
            else q.set("ate", v);
            var s = q.toString();
            location.search = s ? "?" + s : "";
          });
          var bh = bar.querySelector("#lvHoje");
          if (bh)
            bh.addEventListener("click", function () {
              var q = new URLSearchParams(location.search);
              q.delete("ate");
              var s = q.toString();
              location.search = s ? "?" + s : "";
            });
          var bi = bar.querySelector("#lvInfo");
          var tx = bar.querySelector("#lvTexto");
          if (live) {
            tx.innerHTML =
              "<b>Recalculado das fontes " +
              (live.ao_vivo ? "agora" : "até " + dataBR(live.corte)) +
              ":</b> " +
              esc((live.campos_ao_vivo || []).join(", ") || "nada") +
              " (Ploomes e Meta). <b>Do pacote de " +
              dataBR(live.base_snapshot) +
              ":</b> " +
              esc((live.campos_do_pacote || []).join(", ")) +
              "." +
              ((live.avisos || []).length ? " " + esc(live.avisos.join(" ")) : "");
          } else {
            tx.textContent = "Não foi possível recalcular agora; mostrando o último pacote salvo.";
          }
          bi.addEventListener("click", function () {
            var on = tx.classList.toggle("on");
            bi.setAttribute("aria-expanded", on ? "true" : "false");
          });
        }

        function digitando() {
          var t = document.querySelector("#forum textarea");
          return !!(t && (t.value.trim() || document.activeElement === t));
        }
        function vigia() {
          setInterval(function () {
            if (document.hidden) return;
            busca(url())
              .then(function (j) {
                if (!j || !j.dados || !j.live) return;
                var h = document.getElementById("lvHora");
                if (h) h.textContent = hora(j.live.gerado_em);
                if (assina(j.dados) !== assinatura && !digitando()) location.reload();
              })
              .catch(function () {});
          }, POLL_MS);
        }

        function monta(j) {
          var d = j && j.dados;
          if (!d || !d.H || !d.H.fichas) throw new Error("a resposta veio sem os números");
          var A = d.APP;
          if (!A || !A.css || !A.body || !A.js)
            throw new Error("o painel ainda não foi publicado na base");
          window.__HUB_DADOS = d;
          assinatura = assina(d);
          var st = document.createElement("style");
          st.textContent = A.css;
          document.head.appendChild(st);
          var boot = document.getElementById("booting");
          if (boot) boot.remove();
          var h = document.createElement("div");
          h.innerHTML = A.body;
          while (h.firstChild) document.body.appendChild(h.firstChild);
          montaBarra(j.live || null);
          var sc = document.createElement("script");
          sc.textContent = A.js;
          document.body.appendChild(sc);
          if (j.live && j.live.ao_vivo) vigia();
        }

        busca(url())
          .catch(function () {
            // camada ao vivo indisponível: usa o pacote salvo
            return busca(EP + "?t=" + Date.now());
          })
          .then(monta)
          .catch(function (e) {
            erro("Não consegui carregar o painel.", e.message || "erro desconhecido");
          });
      })();
    </script>
  </body>
</html>
